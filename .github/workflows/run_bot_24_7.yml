name: NeX 4GB Rename Bot 24/7 Production Runner

'on':
  workflow_dispatch:
  schedule:
    - cron: '30 */5 * * *'

concurrency:
  group: nex-4gb-rename-bot-live
  cancel-in-progress: true

jobs:
  run-bot:
    name: Run NeX Bot 24/7
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
      contents: read

    steps:
      - name: 100GB+ SSD, 8GB Swap RAM Shield & 8GB RAM-Disk
        run: |
          echo "🛡️ Freeing up disk space for 100GB+ free SSD..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          echo "🛡️ Allocating 8GB Swap RAM file (24GB total memory pool)..."
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "🚀 Remounting /dev/shm with 8GB RAM Disk for 3+ GB/s I/O..."
          sudo mount -o remount,size=8G /dev/shm || true

          echo "✅ Storage, Swap & RAM-Disk Active:"
          df -h /
          df -h /dev/shm
          free -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg psmisc aria2 curl build-essential python3-dev p7zip-full unrar

      - name: Set up Python 3.11 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & C++ Speed Boost
        run: |
          python -m pip install -q --upgrade pip wheel setuptools
          pip install -q tgcrypto uvloop
          pip install -q -r requirements.txt

      - name: Generate .env Configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_NAME: ${{ secrets.DB_NAME || 'NeX_4GB_Rename_Bot' }}
          ADMIN: ${{ secrets.ADMIN }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL }}
          FILES_CHANNEL: ${{ secrets.FILES_CHANNEL }}
          START_PIC: ${{ secrets.START_PIC || 'https://graph.org/file/8ce9f483c987c2635d3da-8d76ae56d500a868e7.jpg' }}
          FORCE_SUB: ${{ secrets.FORCE_SUB || 'Nex_bots' }}
          OWNER_ONLY: ${{ secrets.OWNER_ONLY || 'True' }}
          WEBHOOK: "False"
          PORT: "8090"
        run: |
          set +x
          python3 -c "
          import os
          keys = [
              'API_ID', 'API_HASH', 'BOT_TOKEN', 'STRING_SESSION',
              'DB_URL', 'DB_NAME', 'ADMIN', 'LOG_CHANNEL', 'FILES_CHANNEL',
              'START_PIC', 'FORCE_SUB', 'OWNER_ONLY', 'WEBHOOK', 'PORT'
          ]
          with open('.env', 'w', encoding='utf-8') as f:
              for k in keys:
                  v = os.environ.get(k, '')
                  f.write(f'{k}={v}\n')
          print('✅ Production .env generated successfully.')
          "
          chmod 600 .env

      - name: Linux TCP BBR & Socket Buffer Optimization
        run: |
          echo "⚡ Tuning Linux TCP stack for Gigabit WAN throughput to Telegram DCs..."
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 67108864" || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          echo "✅ TCP BBR and 64MB socket buffers optimized."

      - name: Run NeX Bot for 5h 25m (19500s) with Live Telegram Alerts
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL || '-1002216632939' }}
        run: |
          START_TIME=$(date +%s)
          MAX_RUNTIME=19500

          send_tg() {
            local msg="$1"
            if [ -n "$BOT_TOKEN" ] && [ "$LOG_CHANNEL" != "0" ]; then
              local formatted=$(echo -e "$msg")
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d "chat_id=${LOG_CHANNEL}" \
                --data-urlencode "text=${formatted}" \
                -d "parse_mode=HTML" > /dev/null || true
            fi
          }

          DISK_FREE=$(df -h / | awk 'NR==2 {print $4}')
          DISK_TOTAL=$(df -h / | awk 'NR==2 {print $2}')
          RAM_TOTAL=$(free -h | awk '/^Mem:/ {print $2}')
          SWAP_TOTAL=$(free -h | awk '/^Swap:/ {print $2}')
          RAM_DISK=$(df -h /dev/shm | awk 'NR==2 {print $2}')

          UVLOOP_STATUS=$(python3 -c "import uvloop; print('Active ⚡ (C++ Loop)')" 2>/dev/null || echo "Not Active ❌")
          TGCRYPTO_STATUS=$(python3 -c "import tgcrypto; print('Active ⚡ (C++ AES)')" 2>/dev/null || echo "Not Active ❌")

          STARTUP_ALERT="🚀 <b><u>NeX 4GB Rename Bot — 24/7 Runner Online</u></b> ⚡\n\n"
          STARTUP_ALERT+="🖥️ <b>Host :</b> GitHub Actions (Ubuntu)\n"
          STARTUP_ALERT+="💾 <b>Free SSD :</b> <code>${DISK_FREE} / ${DISK_TOTAL} (100GB+ Shield)</code>\n"
          STARTUP_ALERT+="🧠 <b>Memory Pool :</b> <code>${RAM_TOTAL} RAM + ${SWAP_TOTAL} Swap (24GB)</code>\n"
          STARTUP_ALERT+="🚀 <b>RAM-Disk :</b> <code>${RAM_DISK} (/dev/shm 3+ GB/s I/O)</code>\n"
          STARTUP_ALERT+="⚡ <b>Event Loop :</b> <code>${UVLOOP_STATUS}</code>\n"
          STARTUP_ALERT+="🔐 <b>TgCrypto :</b> <code>${TGCRYPTO_STATUS}</code>\n"
          STARTUP_ALERT+="⏱️ <b>Job Window :</b> <code>5 Hours 25 Minutes (19,500s)</code>\n\n"
          STARTUP_ALERT+="⚡ <i>Ultra-Fast 4GB Rename Engine is active!</i>"

          echo "📤 Sending startup alert to Log Channel..."
          send_tg "$STARTUP_ALERT"

          echo "=========================================================="
          echo "🚀 NeX 4GB Rename Bot Supervisor Initiated"
          echo "⏱️ Max Execution Window: ${MAX_RUNTIME} seconds (5h 25m)"
          echo "=========================================================="

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if [ $ELAPSED -ge $MAX_RUNTIME ]; then
              echo "⏱️ Reached 5h 25m execution limit (${ELAPSED}s elapsed)."
              echo "🔄 Initiating clean runner handoff sequence..."
              break
            fi

            REMAINING=$((MAX_RUNTIME - ELAPSED))
            echo "⚡ [Supervisor] Starting Bot process (Elapsed: ${ELAPSED}s | Remaining: ${REMAINING}s)..."

            # Run bot under timeout
            timeout -s SIGTERM -k 15s "${REMAINING}s" python3 -u bot.py
            EXIT_CODE=$?

            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            # Exit code 124 means timeout reached 19500s successfully
            if [ $EXIT_CODE -eq 124 ] || [ $ELAPSED -ge $MAX_RUNTIME ]; then
              echo "⏱️ 5h 25m window concluded cleanly (Code: ${EXIT_CODE}). Preparing next runner..."
              break
            fi

            # If exited with any code other than 124 before window expired, it's a crash!
            echo "⚠️ [Supervisor] Bot process stopped unexpectedly (Exit code: ${EXIT_CODE})."
            CRASH_ALERT="⚠️ <b><u>NeX Bot Auto-Heal Alert</u></b> 🔄\n\n"
            CRASH_ALERT+="Bot process terminated unexpectedly with exit code: <code>${EXIT_CODE}</code>\n"
            CRASH_ALERT+="⏱️ <b>Elapsed :</b> <code>${ELAPSED}s / ${MAX_RUNTIME}s</code>\n"
            CRASH_ALERT+="🚀 <b>Action :</b> Auto-healing & restarting bot process in 2 seconds..."

            send_tg "$CRASH_ALERT"
            echo "🔄 Auto-restarting in 2 seconds..."
            sleep 2
          done

      - name: Send Handoff Alert & Auto-Trigger Next 24/7 Runner
        if: success() || failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL || '-1002216632939' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          send_tg() {
            local msg="$1"
            if [ -n "$BOT_TOKEN" ] && [ "$LOG_CHANNEL" != "0" ]; then
              local formatted=$(echo -e "$msg")
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d "chat_id=${LOG_CHANNEL}" \
                --data-urlencode "text=${formatted}" \
                -d "parse_mode=HTML" > /dev/null || true
            fi
          }

          HANDOFF_ALERT="🔄 <b><u>NeX Bot 24/7 Runner Handoff</u></b> ⚡\n\n"
          HANDOFF_ALERT+="5h 25m execution window completed.\n"
          HANDOFF_ALERT+="🚀 Dispatching next live relay runner for zero-downtime operation!\n\n"
          HANDOFF_ALERT+="⚡ <b>Status :</b> Zero-Downtime Chain Relay Dispatched"

          echo "📤 Sending handoff alert to Log Channel..."
          send_tg "$HANDOFF_ALERT"

          echo "🔄 Dispatching next 24/7 runner via GitHub CLI..."
          gh workflow run run_bot_24_7.yml --ref main || {
            echo "⚠️ Fallback to GitHub REST API dispatch..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run_bot_24_7.yml/dispatches" \
              -d '{"ref":"main"}' || true
          }
          echo "✅ Next runner dispatch completed."
