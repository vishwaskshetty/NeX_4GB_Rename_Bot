services:
  - type: web
    plan: free
    name: nex-4gb-rename-bot
    env: docker
    dockerfilePath: Dockerfile
    repo: https://github.com/vishwaskshetty/NeX_4GB_Rename_Bot
    branch: main
    autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: FILES_CHANNEL
        sync: false
      - key: FORCE_SUB
        sync: false
      - key: LOG_CHANNEL
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_URL
        sync: false
      - key: START_PIC
        sync: false
      - key: ADMIN
        sync: false
      - key: OWNER_ONLY
        sync: false
      - key: WEBHOOK
        sync: false
